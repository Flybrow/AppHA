# Copier en `config.toml` à côté de l'exécutable
# (ou dans %APPDATA%\ha-kiosk\ / ~/.config/ha-kiosk/).

# Adresse de Home Assistant (http, https, IP locale, nom de domaine, Nabu Casa...).
url = "https://homeassistant.local:8123"

# Chemin du dashboard (vide = dashboard par défaut). Ex. "lovelace-kiosk/0".
dashboard = ""

# Jeton longue durée (Profil HA > Sécurité > Jetons d'accès longue durée).
# Connexion automatique avec le navigateur `webview`. Vide = écran de connexion.
token = ""

# auto | webview | external
#  - auto     : webview (connexion par jeton + paramètres à l'écran)
#  - webview  : WebView2 (Windows) / WebKitGTK (Linux) intégrée
#  - external : la commande ci-dessous
browser = "auto"

# Commande du navigateur externe ; {url} est remplacé par l'URL du dashboard.
# Exemples :
#   ["cog", "--platform=drm", "{url}"]
#   ["chromium", "--kiosk", "--noerrdialogs", "--disable-infobars", "--renderer-process-limit=1", "{url}"]
command = ["cog", "{url}"]

# Accepter un certificat HTTPS auto-signé (WebView2, WebKitGTK, cog).
insecure_tls = false

# Mise à jour automatique depuis les releases GitHub.
auto_update = true

[window]
mode = "fullscreen"   # fullscreen | windowed | borderless (fenêtré sans bordure)
width = 1280          # taille en modes windowed / borderless
height = 800
gpu = false           # accélération matérielle : +~70 Mo ; inutile sur Pi 3 (GPU trop ancien)
animations = false    # false = bien plus fluide sur Pi (défaut sous Linux)
rotation = 0          # 0 | 90 | 180 | 270 (Linux/cage ; écran officiel Pi retourné : 180)

[supervisor]
check_interval_secs = 10
restart_every_hours = 24     # 0 = jamais
max_memory_mb = 0            # 0 = pas de limite (ex. 350 sur un Pi 3)
reload_on_reconnect = true
failures_before_down = 3
