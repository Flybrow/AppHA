# Copy to `config.toml` next to the executable
# (or into %APPDATA%\ha-kiosk\ / ~/.config/ha-kiosk/ / /etc/ha-kiosk/).
# Easier: `ha-kiosk setup` (wizard) or the settings screen.

# Home Assistant address (http, https, local IP, domain name, Nabu Casa...).
url = "https://homeassistant.local:8123"

# Dashboard path (empty = default dashboard), e.g. "lovelace-kiosk/0".
dashboard = ""

# Long-lived access token (HA profile > Security > Long-lived access tokens).
# Automatic login. Empty = HA login screen.
token = ""

# Interface language: auto (system) | en | fr
language = "auto"

# auto | webview | external
#  - auto     : webview (token login + on-screen settings)
#  - webview  : built-in WebView2 (Windows) / WebKitGTK (Linux)
#  - external : the command below
browser = "auto"

# External browser command; {url} is replaced by the dashboard URL.
# Examples:
#   ["cog", "--platform=drm", "{url}"]
#   ["chromium", "--kiosk", "--noerrdialogs", "--disable-infobars", "--renderer-process-limit=1", "{url}"]
command = ["cog", "{url}"]

# Accept a self-signed HTTPS certificate (WebView2, WebKitGTK, cog).
insecure_tls = false

# Start with the machine (Windows: user session; Linux: systemd service, change with sudo).
autostart = true

# Automatic updates from GitHub releases (checked every 6 h).
auto_update = true

[window]
mode = "fullscreen"   # fullscreen | windowed | borderless
width = 1280          # size in windowed / borderless modes
height = 800
gpu = false           # hardware acceleration: +~70 MB; useless on a Pi 3 (GPU too old)
animations = false    # false = much smoother on a Pi (default on Linux)
hide_cursor = false   # true = hidden cursor (touch screen)
rotation = 0          # 0 | 90 | 180 | 270 (Linux/cage; official Pi screen upside down: 180)

[supervisor]
check_interval_secs = 10
restart_every_hours = 24     # 0 = never
max_memory_mb = 0            # 0 = no limit (e.g. 350 on a Pi 3)
reload_on_reconnect = true
failures_before_down = 3
