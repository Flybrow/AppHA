<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>HA Kiosk</title>
<style>/*THEME*/</style>
<style>
  body { display: grid; place-items: center; text-align: center; padding: 16px; }
  .spinner {
    width: 48px; height: 48px; margin: 0 auto 24px; border-radius: 50%;
    border: 4px solid var(--border); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
  p { margin: 0 0 24px; word-break: break-all; }
</style>
</head>
<body>
  <main>
    <div class="spinner"></div>
    <h1 id="status">Connexion à Home Assistant…</h1>
    <p class="muted" id="target"></p>
    <button onclick="window.ipc.postMessage('settings')">Paramètres</button>
  </main>
<script>
  // Joignabilité testée côté Rust, qui appelle ces fonctions.
  const BASE = /*BASE*/, TARGET = /*TARGET*/;
  document.getElementById("target").textContent = BASE;
  window.onUnreachable = () =>
    (document.getElementById("status").textContent = "Home Assistant injoignable, nouvel essai…");
  window.onReachable = () => location.replace(TARGET);
  window.ipc.postMessage("ready");
</script>
</body>
</html>
