<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HA Kiosk</title>
<style>/*THEME*/</style>
<style>
  body { display: grid; place-items: center; text-align: center; padding: 16px; }
  .spinner {
    width: 48px; height: 48px; margin: 0 auto 24px; border-radius: 50%;
    border: 4px solid var(--border); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
  p { margin: 0 0 24px; word-break: break-all; }
</style>
</head>
<body>
  <main>
    <div class="spinner"></div>
    <h1 id="status"></h1>
    <p class="muted" id="target"></p>
    <button id="settings" onclick="window.ipc.postMessage('settings')"></button>
  </main>
<script>
  // Reachability is tested by Rust, which calls these functions.
  const BASE = /*BASE*/, TARGET = /*TARGET*/, LANG = /*LANG*/;
  const t = (en, fr) => (LANG === "fr" ? fr : en);
  const $ = (id) => document.getElementById(id);
  document.documentElement.lang = LANG;
  $("status").textContent = t("Connecting to Home Assistant…", "Connexion à Home Assistant…");
  $("settings").textContent = t("Settings", "Paramètres");
  $("target").textContent = BASE;
  window.onUnreachable = () => ($("status").textContent = t("Home Assistant unreachable, retrying…", "Home Assistant injoignable, nouvel essai…"));
  window.onReachable = () => location.replace(TARGET);
  window.ipc.postMessage("ready");
</script>
</body>
</html>
